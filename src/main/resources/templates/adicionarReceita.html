<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Receita</title>
    <script th:inline="javascript">
        const ingredientes = /*[[${listaIngredientes}]]*/ [];
        const medidas = /*[[${ListarMedidas}]]*/ [];
    </script>
</head>
<body>

<h2>Adicionar Receita</h2>

<form id="form-receita" th:action="@{/receita/ui/adicionarReceitaBd}" th:object="${receita}" method="post">
    <label>Nome da Receita</label>
    <input type="text" th:field="*{nome}" required>

    <label>Modo de Preparo</label>
    <textarea th:field="*{preparo}" rows="4" required></textarea>

    <label>Categoria</label>
    <select th:field="*{categoria.id}" required>
        <option value="">-- selecione --</option>
        <option th:each="c : ${listaCategoria}" th:value="${c.id}" th:text="${c.nome}"></option>
    </select>

    <h3>Ingredientes</h3>
    <button type="button" onclick="adicionarIngrediente()">+ Adicionar Ingrediente</button>

    <table>
        <thead>
        <tr>
            <th>Ingrediente</th>
            <th>Medida</th>
            <th>Quantidade</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="ingredientes-body"></tbody>
    </table>

    <button type="submit">Salvar Receita</button>
</form>

<script>
    const tbody = document.getElementById('ingredientes-body');
    let index = 0;

    function adicionarIngrediente() {
        const row = document.createElement('tr');

        const ingredienteOptions = ingredientes.map(i =>
            `<option value="${i.id}">${i.nome}</option>`
        ).join('');

        const medidaOptions = medidas.map(m =>
            `<option value="${m.id}">${m.medida}</option>`
        ).join('');

        row.innerHTML = `
      <td>
        <select name="itens[${index}].ingrediente.id" required>
          <option value="">-- selecione --</option>
          ${ingredienteOptions}
        </select>
      </td>
      <td>
        <select name="itens[${index}].medida.id" required>
          <option value="">-- selecione --</option>
          ${medidaOptions}
        </select>
      </td>
      <td>
        <input type="number" name="itens[${index}].quantidade" step="0.01" required>
      </td>
      <td>
        <button type="button" onclick="removerLinha(this)">✕</button>
      </td>
    `;

        tbody.appendChild(row);
        index++;
    }

    function removerLinha(btn) {
        btn.closest('tr').remove();
        reindexarCampos();
    }

    function reindexarCampos() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, i) => {
            row.querySelectorAll('input, select').forEach(el => {
                if (el.name) {
                    el.name = el.name.replace(/itens\[\d+\]/, `itens[${i}]`);
                }
            });
        });
        index = rows.length;
    }

    document.getElementById('form-receita').addEventListener('submit', () => {
        reindexarCampos();
    });
</script>

</body>
</html>
