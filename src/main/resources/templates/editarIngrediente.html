<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Ingrediente – Meu Site de Receitas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(90deg, #667eea, #764ba2);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        nav li {
            margin: 0 1rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
        }
        nav a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        nav a.active {
            background: rgba(255,255,255,0.3);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="text"] {
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 0.75rem 0;
            border: none;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-submit {
            background: linear-gradient(90deg, #43cea2, #185a9d);
            color: #fff;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #ececec;
            color: #555;
        }

        .btn-cancel:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><a th:href="@{/}" th:classappend="${page=='home'} ? 'active'">Home</a></li>
        <li><a th:href="@{/adicionar/ui/paginaAdicionar}" th:classappend="${page=='adicionar'} ? 'active'">Adicionar</a></li>
        <li><a th:href="@{/adicionar/ui/paginaListarIngrediente}" th:classappend="${page=='ingredientes'} ? 'active'">Ingredientes</a></li>
        <li><a th:href="@{/receita/ui/listarReceitas}" th:classappend="${page=='receitas'} ? 'active'">Receitas</a></li>
        <li><a th:href="@{/cardapio/ui/paginaCardapio}" th:classappend="${page=='cardapio'} ? 'active'">Cardápio</a></li>
    </ul>
</nav>

<main>
    <div class="card">
        <h2>Editar Ingrediente</h2>
        <form th:action="@{'/adicionar/ui/editarIngrediente/'+${ingrediente.id}}" th:object="${ingrediente}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div>
                <label for="nome">Nome do Ingrediente</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Farinha de trigo" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-submit">Salvar</button>
                <button type="button" class="btn btn-cancel" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
