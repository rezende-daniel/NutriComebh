<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f0f4f8;
            color: #333;
        }

        nav {
            background: linear-gradient(90deg, #667eea, #764ba2);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        nav li { margin: 0 1rem; }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
        }
        nav a:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        nav a.active { background: rgba(255,255,255,0.3); }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            margin: auto;
        }
        h2 { margin-bottom: 1rem; color: #333; }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        label { display: block; margin-top: 15px; font-weight: 500; }
        input[type="number"], select {
            padding: 8px; margin-top: 5px;
            border: 1px solid #ccc; border-radius: 4px;
        }

        table {
            width: 100%; border-collapse: collapse; margin-top: 20px;
        }
        th, td {
            padding: 10px; border: 1px solid #ddd; text-align: center;
        }
        th { background: #f0f0f0; }

        button {
            margin-top: 10px; padding: 8px 12px;
            background: #4CAF50; color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #45a049; }
        .remove-btn { background: #e74c3c; }
        .remove-btn:hover { background: #c0392b; }

        footer {
            background: #fff;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
            font-size: 0.875rem;
        }
    </style>
</head>

<script>
    function adicionarSelect(btn, refeicao) {
        const container = btn.previousElementSibling;
        const select = document.createElement('select');
        select.name = refeicao;

        const option = document.createElement('option');
        option.value = "";
        option.text = "-- selecione --";
        select.appendChild(option);

        const template = container.querySelector('select');
        if (template) {
            select.innerHTML = template.innerHTML;
        }

        container.appendChild(select);
    }
</script>
