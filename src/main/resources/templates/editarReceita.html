<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Receita</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h2 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .remove-btn {
            background-color: #e74c3c;
        }

        .remove-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<h2>Editar Receita</h2>

<form th:action="@{/editarReceitaBd}" th:object="${receita}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Nome da Receita</label>
    <input type="text" th:field="*{nome}" required>

    <label>Modo de Preparo</label>
    <textarea th:field="*{preparo}" rows="1" required></textarea>

    <label>Categoria</label>
    <select th:field="*{categoria.id}" required>
        <option value="">-- selecione --</option>
        <option th:each="cat : ${listaCategoria}" th:value="${cat.id}" th:text="${cat.nome}"
                th:selected="${cat.id} == ${receita.categoria.id}"></option>
    </select>

    <h3>Ingredientes</h3>
    <table>
        <thead>
        <tr>
            <th>Ingrediente</th>
            <th>Medida</th>
            <th>Quantidade</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item, iStat : *{itens}">
            <td>
                <h4 th:name="'itens[' + ${iStat.index} + '].ingrediente.id'" required>

                    <option th:each="ing : ${receita.itens}" th:value="${ing.id}" th:text="${ing.ingrediente.nome}"
                            th:selected="${ing.id} == ${item.ingrediente.id}"></option>
                </h4>
            </td>
            <td>
                <select th:name="'itens[' + ${iStat.index} + '].medida.id'" required>
                    <option value="">-- selecione --</option>
                    <option th:each="med : ${medidas}" th:value="${med.id}" th:text="${med.medida}"
                            th:selected="${med.id} == ${item.medida.id}"></option>
                </select>
            </td>
            <td>
                <input type="number" th:name="'itens[' + ${iStat.index} + '].quantidade'"
                       th:value="${item.quantidade}" step="0.1" required>
            </td>
            <td>
                <button type="button" class="remove-btn" onclick="removerLinha(this)">✕</button>
            </td>
        </tr>
        </tbody>
    </table>

    <button type="submit">Salvar Alterações</button>
</form>

<script>
    function removerLinha(btn) {
        btn.closest('tr').remove();
        reindexarCampos();
    }

    function reindexarCampos() {
        const rows = document.querySelectorAll('tbody tr');
        rows.forEach((row, i) => {
            row.querySelectorAll('input, select').forEach(el => {
                if (el.name) {
                    el.name = el.name.replace(/itens\[\d+\]/, `itens[${i}]`);
                }
            });
        });
    }

    document.querySelector('form').addEventListener('submit', () => {
        reindexarCampos();
    });
</script>

</body>
</html>
