<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Início – Meu Site de Receitas</title>
    <style>
        /* Fonte e reset */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f0f4f8;
            color: #333;
        }

        /* Barra de navegação */
        nav {
            background: linear-gradient(90deg, #667eea, #764ba2);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        nav li {
            margin: 0 1rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
        }
        nav a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        nav a.active {
            background: rgba(255,255,255,0.3);
        }

        /* Seção principal (hero) */
        main.hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right bottom, #43cea2, #185a9d);
            text-align: center;
            padding: 2rem;
        }
        .hero-content h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 1rem;
        }
        .hero-content p {
            font-size: 1.25rem;
            color: #eef2f7;
        }

        /* Rodapé */
        footer {
            background: #fff;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
            font-size: 0.875rem;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .hero-content p {
                font-size: 1rem;
            }
            nav ul {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><a th:href="@{/}" th:classappend="${page=='home'} ? 'active'">Home</a></li>
        <li><a th:href="@{/adicionar/ui/paginaAdicionar}" th:classappend="${page=='adicionar'} ? 'active'">Adicionar</a></li>
        <li><a th:href="@{/ingredientes}" th:classappend="${page=='ingredientes'} ? 'active'">Ingredientes</a></li>
        <li><a th:href="@{/receitas}" th:classappend="${page=='receitas'} ? 'active'">Receitas</a></li>
        <li><a th:href="@{/cardapio}" th:classappend="${page=='cardapio'} ? 'active'">Cardápio</a></li>
    </ul>
</nav>

<main class="hero">
    <div class="hero-content">
        <h1>Seja bem-vindo ao Meu Site de Receitas!</h1>
        <p>Explore nossas receitas, adicione seus ingredientes e crie pratos incríveis.</p>
    </div>
</main>

<footer>
    <p th:text="'Você está na página ' + ${page}">Você está na página home</p>
</footer>
</body>
</html>
